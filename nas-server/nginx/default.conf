server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /tiles/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2592000" always;
        # 未下载到的瓦片返回透明图，避免地图边缘出现灰块或日志刷 404
        try_files $uri /tiles/blank.png =404;
    }
}
